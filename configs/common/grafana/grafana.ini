#################################### Paths ####################################

[paths]
# Grafana 数据库、会话等数据的存储目录
data = /var/lib/grafana

# 日志文件目录；当前配置主要向控制台输出日志
logs = /var/log/grafana

# Grafana 插件目录
plugins = /var/lib/grafana/plugins

# 自动配置文件目录
provisioning = /etc/grafana/provisioning


#################################### Server ###################################

[server]
protocol = http

# 必须监听 0.0.0.0，才能通过容器端口映射访问
http_addr = 0.0.0.0

http_port = 3000

# 如果不是部署在反向代理子路径下，保持 false
serve_from_sub_path = false


#################################### Database #################################

[database]
# 单机监控场景使用内置 SQLite 即可
type = sqlite3

# SQLite 数据库写入持久化目录
path = /var/lib/grafana/grafana.db


#################################### Security #################################

[security]
# 管理员密码建议通过 Docker 环境变量传入
admin_user = admin

# 不在配置文件里写明文密码
disable_gravatar = true


#################################### Users ####################################

[users]
# 禁止用户自行注册
allow_sign_up = false

# 默认组织名称
default_theme = dark


################################ Anonymous Auth ###############################

[auth.anonymous]
# 禁止匿名访问
enabled = false


#################################### Logging ##################################

[log]
# Docker 环境下建议主要输出到 stdout/stderr
mode = console
level = info
