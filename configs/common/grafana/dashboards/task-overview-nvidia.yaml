  description: 整卡 GPU 活动时间比例；高值不等于 Tensor 算力或显存带宽已饱和。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: DCGM_FI_DEV_GPU_UTIL{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`,gpu_index=~`${gpu_index:regex}`}
    legendFormat: '{{gpu_node}} / {{gpu_model}} / 卡{{gpu_index}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 0
    y: 155
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: percent
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 73
  title: GPU 显存占用
  description: 整卡已用显存比例，含权重、KV 和运行开销；不等同 KV Cache 使用率。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: 100 * DCGM_FI_DEV_FB_USED{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`,gpu_index=~`${gpu_index:regex}`}
      / (DCGM_FI_DEV_FB_USED{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`,gpu_index=~`${gpu_index:regex}`}
      + DCGM_FI_DEV_FB_FREE{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`,gpu_index=~`${gpu_index:regex}`})
    legendFormat: '{{gpu_node}} / {{gpu_model}} / 卡{{gpu_index}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 8
    y: 155
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: percent
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 74
  title: GPU 已用显存
  description: 各卡已用显存字节数，包含同卡其他进程。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: DCGM_FI_DEV_FB_USED{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`,gpu_index=~`${gpu_index:regex}`}
      * 1048576
    legendFormat: '{{gpu_node}} / {{gpu_model}} / 卡{{gpu_index}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 16
    y: 155
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: bytes
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 75
  title: GPU 功率
  description: 各卡当前功耗；结合温度、时钟和利用率观察功耗限制。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: DCGM_FI_DEV_POWER_USAGE{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`,gpu_index=~`${gpu_index:regex}`}
    legendFormat: '{{gpu_node}} / {{gpu_model}} / 卡{{gpu_index}}'
