- id: 49
  title: Logs Volume
  description: 每个时间窗的日志条数；无级别信息归 unknown，图例求和不代替精确全时段日志计数。
  type: timeseries
  datasource: &id002
    type: loki
    uid: $loki_datasource
  targets:
  - refId: A
    expr: sum by (log_level) (count_over_time({task=${task:doublequote},instance_role=~"$instance_role",replica=~"$replica",source_file=~"$source_file"}
      |= ${log_search:doublequote} | label_format log_level=`{{if .detected_level}}{{.detected_level}}{{else}}unknown{{end}}`
      [$__interval]))
    legendFormat: '{{log_level}}'
    editorMode: code
    range: true
    datasource: *id002
    queryType: range
  gridPos:
    x: 0
    y: 104
    w: 24
    h: 6
  fieldConfig:
    defaults:
      unit: short
      min: 0
      custom:
        drawStyle: bars
        fillOpacity: 100
        lineWidth: 0
        stacking:
          mode: normal
          group: logs
    overrides:
    - matcher:
        id: byName
        options: error
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: red
    - matcher:
        id: byName
        options: warning
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: yellow
    - matcher:
        id: byName
        options: warn
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: yellow
    - matcher:
        id: byName
        options: info
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: green
    - matcher:
        id: byName
        options: debug
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: blue
    - matcher:
        id: byName
        options: unknown
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: gray
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
  interval: 5s
- id: 50
  title: 推理日志（每 5 秒自动刷新）
  description: Dashboard 是轮询刷新；需要真正的 Live 流式跟踪时，在 Explore 选 Benchmark Loki 使用同一查询并点击 Live。
  type: logs
  datasource: *id002
  targets:
  - refId: A
    expr: '{task=${task:doublequote},instance_role=~"$instance_role",replica=~"$replica",source_file=~"$source_file"} |= ${log_search:doublequote}'
    legendFormat: 日志
    editorMode: code
    range: true
    datasource: *id002
    queryType: range
    maxLines: 1000
  gridPos:
    x: 0
    y: 110
    w: 24
    h: 12
  fieldConfig:
    defaults:
      unit: short
      min: 0
    overrides: []
  options:
    showTime: true
    showLabels: false
    showCommonLabels: true
    wrapLogMessage: true
    prettifyLogMessage: false
    enableLogDetails: true
    dedupStrategy: none
    sortOrder: Descending
  links:
  - title: Explore 中可用 Live 持续跟踪
    url: /explore
templating:
  list:
  - name: datasource
    label: 指标数据源
    type: datasource
    query: prometheus
    current:
      text: Benchmark Prometheus
      value: benchmark-prometheus
  - name: loki_datasource
    label: 日志数据源
    type: datasource
