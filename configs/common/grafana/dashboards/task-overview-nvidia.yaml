- id: 79
  title: GPU 空闲显存
  description: 各卡当前空闲显存；关注是否有扩展 KV 或并发的空间。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: DCGM_FI_DEV_FB_FREE{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`,gpu_index=~`${gpu_index:regex}`}
      * 1048576
    legendFormat: '{{gpu_node}} / {{gpu_model}} / 卡{{gpu_index}}'
    editorMode: code
