- id: 25
  title: vLLM TTFT
  description: ''
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: histogram_quantile(0.5, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket{task=~`${task:regex}`}[$__rate_interval])))
    legendFormat: P50
    editorMode: code
    range: true
    datasource: *id001
  - refId: B
    expr: histogram_quantile(0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket{task=~`${task:regex}`}[$__rate_interval])))
    legendFormat: P95
    editorMode: code
    range: true
    datasource: *id001
  - refId: C
    expr: histogram_quantile(0.99, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket{task=~`${task:regex}`}[$__rate_interval])))
    legendFormat: P99
    editorMode: code
