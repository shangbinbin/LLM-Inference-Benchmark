- id: 77
  title: GPU 时钟
  description: 各卡 SM 与显存频率；与功耗、温度一起观察降频。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: DCGM_FI_DEV_SM_CLOCK{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`,gpu_index=~`${gpu_index:regex}`}
    legendFormat: SM {{gpu_node}} / {{gpu_model}} / 卡{{gpu_index}}
    editorMode: code
    range: true
