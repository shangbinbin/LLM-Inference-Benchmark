id: null
uid: inference-task-overview
title: 推理任务总览 · NVIDIA
description: 按任务查看 SGLang/vLLM；node-exporter 按任务/主机采集目标展示整体资源；GPU 类型由启动器选择，按节点/型号/卡序号联动；日志按任务/角色/副本筛选。未暴露的指标显示无数据，不伪造为 0。
tags:
- inference
- task
- nvidia
schemaVersion: 39
version: 2
editable: false
timezone: browser
refresh: 5s
time:
  from: now-30m
  to: now
panels:
- id: 1
  type: row
  title: 推理任务采集状态
  collapsed: false
  gridPos:
    x: 0
    y: 0
    w: 24
    h: 1
  panels: []
- id: 2
  title: 推理实例健康
  description: 1 为采集正常，0 为失败；任务内各实例独立显示。
  type: stat
  datasource: &id001
    type: prometheus
    uid: $datasource
  targets:
  - refId: A
    expr: up{task=~`${task:regex}`,job="inference"}
    legendFormat: '{{replica}} / {{instance_role}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 0
    y: 1
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: short
      min: 0
    overrides: []
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
    graphMode: area
- id: 3
  title: 运行实例数
  description: ''
  type: stat
  datasource: *id001
  targets:
  - refId: A
    expr: sum(up{task=~`${task:regex}`,job="inference"})
    legendFormat: UP
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 8
    y: 1
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: short
      min: 0
    overrides: []
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
    graphMode: area
- id: 4
  title: GPU Exporter 健康
  description: ''
  type: stat
  datasource: *id001
  targets:
  - refId: A
    expr: up{task=~`${task:regex}`,gpu_vendor="nvidia",job="nvidia-dcgm-exporter"}
    legendFormat: '{{gpu_node}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 16
    y: 1
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: short
      min: 0
    overrides: []
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
    graphMode: area
- id: 5
  type: row
  title: 主机资源 · node-exporter（按任务 / 主机采集目标筛选）
  collapsed: false
  gridPos:
    x: 0
    y: 8
    w: 24
    h: 1
  panels: []
- id: 6
  title: 主机 Exporter 健康
  description: '1 为采集成功，0 为失败；主机下拉保留采集失败的目标。当前为容器采集视角；真实 Linux 节点应配置 host_metrics: host 和 node_exporter_target，才能完整观察宿主机文件系统及网络。这些指标不代表任务独占资源。'
  type: stat
  datasource: *id001
  targets:
  - refId: A
    expr: up{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`}
    legendFormat: '{{instance}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 0
    y: 9
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: short
      min: 0
    overrides: []
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
    graphMode: area
- id: 7
  title: 主机 CPU 使用率
  description: 各逻辑 CPU 平均非 idle 时间，包含 iowait；不是推理进程或客户端独占使用率。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,mode="idle"}[$__rate_interval])))
    legendFormat: '{{instance}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 8
    y: 9
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: percent
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 8
  title: 主机 CPU I/O 等待
  description: CPU 等待 I/O 的时间比例，结合磁盘忙碌率及设备吞吐定位存储瓶颈。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: 100 * avg by (instance) (rate(node_cpu_seconds_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,mode="iowait"}[$__rate_interval]))
    legendFormat: '{{instance}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 16
    y: 9
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: percent
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 9
  title: 主机系统负载
  description: 1/5/15 分钟原始 load average，含可运行及不可中断等待任务；不是 CPU 百分比，需结合节点 CPU 核数判断。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: node_load1{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`}
    legendFormat: '{{instance}} / 1'
    editorMode: code
    range: true
    datasource: *id001
  - refId: B
    expr: node_load5{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`}
    legendFormat: '{{instance}} / 5'
    editorMode: code
    range: true
    datasource: *id001
  - refId: C
    expr: node_load15{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`}
    legendFormat: '{{instance}} / 15'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 0
    y: 16
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: short
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 10
  title: 主机内存使用率
  description: 使用 MemAvailable 而非 MemFree，避免把可回收缓存全部视作已用内存。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: 100 * (1 - node_memory_MemAvailable_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`} /
      (node_memory_MemTotal_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`} > 0))
    legendFormat: '{{instance}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 8
    y: 16
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: percent
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 11
  title: 主机内存容量
  description: ''
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: node_memory_MemTotal_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`} - node_memory_MemAvailable_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`}
    legendFormat: '{{instance}} / 已用'
    editorMode: code
    range: true
    datasource: *id001
  - refId: B
    expr: node_memory_MemAvailable_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`}
    legendFormat: '{{instance}} / 可用'
    editorMode: code
    range: true
    datasource: *id001
  - refId: C
    expr: node_memory_MemTotal_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`}
    legendFormat: '{{instance}} / 总量'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 16
    y: 16
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: bytes
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 12
  title: 主机 Swap 容量
  description: 未配置 Swap 时为 0；不计算除以零的使用率。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: node_memory_SwapTotal_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`} - node_memory_SwapFree_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`}
    legendFormat: '{{instance}} / 已用'
    editorMode: code
    range: true
    datasource: *id001
  - refId: B
    expr: node_memory_SwapTotal_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`}
    legendFormat: '{{instance}} / 总量'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 0
    y: 23
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: bytes
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 13
  title: 主机文件系统使用率
  description: '按挂载点展示，使用普通用户可用空间计算；排除常见虚拟文件系统，0 容量不参与计算。当前为容器采集视角；真实 Linux 节点应配置 host_metrics: host 和 node_exporter_target，才能完整观察宿主机文件系统及网络。'
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: 100 * (1 - node_filesystem_avail_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs",mountpoint!~"/(dev|proc|sys|run)($|/.*)"}
      / (node_filesystem_size_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs",mountpoint!~"/(dev|proc|sys|run)($|/.*)"}
      > 0))
    legendFormat: '{{instance}} / {{mountpoint}} / {{device}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 8
    y: 23
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: percent
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 14
  title: 主机文件系统可用空间
  description: 按挂载点保留独立序列，不将同一设备的多个挂载点相加。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: node_filesystem_avail_bytes{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,fstype!~"tmpfs|devtmpfs|overlay|squashfs|nsfs",mountpoint!~"/(dev|proc|sys|run)($|/.*)"}
    legendFormat: '{{instance}} / {{mountpoint}} / {{device}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 16
    y: 23
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: bytes
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 15
  title: 主机磁盘读写吞吐
  description: 按块设备展示字节速率，排除 loop/ram/fd；dm/md 与底层盘可能重复，不跨层求和。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: rate(node_disk_read_bytes_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,device!~"loop[0-9]+|ram[0-9]+|fd[0-9]+"}[$__rate_interval])
    legendFormat: '{{instance}} / {{device}} / 读'
    editorMode: code
    range: true
    datasource: *id001
  - refId: B
    expr: rate(node_disk_written_bytes_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,device!~"loop[0-9]+|ram[0-9]+|fd[0-9]+"}[$__rate_interval])
    legendFormat: '{{instance}} / {{device}} / 写'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 0
    y: 30
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: Bps
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 16
  title: 主机磁盘 IOPS
  description: ''
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: rate(node_disk_reads_completed_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,device!~"loop[0-9]+|ram[0-9]+|fd[0-9]+"}[$__rate_interval])
    legendFormat: '{{instance}} / {{device}} / 读'
    editorMode: code
    range: true
    datasource: *id001
  - refId: B
    expr: rate(node_disk_writes_completed_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,device!~"loop[0-9]+|ram[0-9]+|fd[0-9]+"}[$__rate_interval])
    legendFormat: '{{instance}} / {{device}} / 写'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 8
    y: 30
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: iops
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 17
  title: 主机磁盘忙碌率
  description: 设备有 I/O 在执行的时间比例；不代表 NVMe/RAID 的吞吐能力已达上限。
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: 100 * rate(node_disk_io_time_seconds_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,device!~"loop[0-9]+|ram[0-9]+|fd[0-9]+"}[$__rate_interval])
    legendFormat: '{{instance}} / {{device}}'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 16
    y: 30
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: percent
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
- id: 18
  title: 主机网络收发吞吐
  description: '按“主机网卡”筛选，保留 lo/网桥/veth 以观察同机容器流量；bond 与成员接口、虚拟与物理接口不求和。当前为容器采集视角；真实 Linux 节点应配置 host_metrics: host 和 node_exporter_target，才能完整观察宿主机文件系统及网络。'
  type: timeseries
  datasource: *id001
  targets:
  - refId: A
    expr: rate(node_network_receive_bytes_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,device=~`${net_device:regex}`}[$__rate_interval])
    legendFormat: '{{instance}} / {{device}} / 收'
    editorMode: code
    range: true
    datasource: *id001
  - refId: B
    expr: rate(node_network_transmit_bytes_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`,device=~`${net_device:regex}`}[$__rate_interval])
    legendFormat: '{{instance}} / {{device}} / 发'
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 0
    y: 37
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: Bps
      min: 0
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
