- id: 80
  title: 可见 GPU 卡数
  description: 当前筛选下采集到利用率指标的 GPU 序列数；不是配置文件声明的卡数。
  type: stat
  datasource: *id001
  targets:
  - refId: A
    expr: count(DCGM_FI_DEV_GPU_UTIL{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`,gpu_index=~`${gpu_index:regex}`})
    legendFormat: 卡数
    editorMode: code
    range: true
    datasource: *id001
  gridPos:
    x: 16
    y: 169
    w: 8
    h: 7
  fieldConfig:
    defaults:
      unit: short
      min: 0
    overrides: []
  options:
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
    colorMode: value
    graphMode: area
- id: 81
  type: row
  title: 推理实例日志 · 任务 → 角色 → 副本
  collapsed: false
  gridPos:
    x: 0
    y: 176
    w: 24
    h: 1
  panels: []
- id: 82
  title: Logs Volume
  description: 每个时间窗的日志条数；无级别信息归 unknown，图例求和不代替精确全时段日志计数。
  type: timeseries
  datasource: &id002
    type: loki
    uid: $loki_datasource
  targets:
  - refId: A
    expr: sum by (log_level) (count_over_time({task=${task:doublequote},instance_role=~"$instance_role",replica=~"$replica",source_file=~"$source_file"}
      |= ${log_search:doublequote} | label_format log_level=`{{if .detected_level}}{{.detected_level}}{{else}}unknown{{end}}`
      [$__interval]))
    legendFormat: '{{log_level}}'
    editorMode: code
    range: true
    datasource: *id002
    queryType: range
  gridPos:
    x: 0
    y: 177
    w: 24
    h: 6
  fieldConfig:
    defaults:
      unit: short
      min: 0
      custom:
        drawStyle: bars
        fillOpacity: 100
        lineWidth: 0
        stacking:
          mode: normal
          group: logs
    overrides:
    - matcher:
        id: byName
        options: error
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: red
    - matcher:
        id: byName
        options: warning
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: yellow
    - matcher:
        id: byName
        options: warn
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: yellow
    - matcher:
        id: byName
        options: info
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: green
    - matcher:
        id: byName
        options: debug
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: blue
    - matcher:
        id: byName
        options: unknown
      properties:
      - id: color
        value:
          mode: fixed
          fixedColor: gray
  options:
    legend:
      displayMode: list
      placement: bottom
    tooltip:
      mode: multi
      sort: desc
  interval: 5s
- id: 83
  title: 推理日志（每 5 秒自动刷新）
  description: Dashboard 是轮询刷新；需要真正的 Live 流式跟踪时，在 Explore 选 Benchmark Loki 使用同一查询并点击 Live。
  type: logs
  datasource: *id002
  targets:
  - refId: A
    expr: '{task=${task:doublequote},instance_role=~"$instance_role",replica=~"$replica",source_file=~"$source_file"} |= ${log_search:doublequote}'
    legendFormat: 日志
    editorMode: code
    range: true
    datasource: *id002
    queryType: range
    maxLines: 1000
  gridPos:
    x: 0
    y: 183
    w: 24
    h: 12
  fieldConfig:
    defaults:
      unit: short
      min: 0
    overrides: []
  options:
    showTime: true
    showLabels: false
    showCommonLabels: true
    wrapLogMessage: true
    prettifyLogMessage: false
    enableLogDetails: true
    dedupStrategy: none
    sortOrder: Descending
  links:
  - title: Explore 中可用 Live 持续跟踪
    url: /explore
templating:
  list:
  - name: datasource
    label: 指标数据源
    type: datasource
    query: prometheus
    current:
      text: Benchmark Prometheus
      value: benchmark-prometheus
  - name: loki_datasource
    label: 日志数据源
    type: datasource
    query: loki
    current:
      text: Benchmark Loki
      value: benchmark-loki
  - name: task
    label: 推理任务
    type: query
    datasource: *id001
    definition: label_values(up{task!=""}, task)
    query:
      query: label_values(up{task!=""}, task)
      refId: StandardVariableQuery
    refresh: 1
    sort: 1
    multi: false
    includeAll: false
    allValue: null
    current: {}
  - name: inference_instance
    label: 推理实例
    type: query
    datasource: *id001
    definition: label_values(up{task=~`${task:regex}`,job="inference"}, instance)
    query:
      query: label_values(up{task=~`${task:regex}`,job="inference"}, instance)
      refId: StandardVariableQuery
    refresh: 1
    sort: 1
    multi: true
    includeAll: true
    allValue: .*
    current:
      text: All
      value: $__all
  - name: host
    label: 主机采集目标
    type: query
    datasource: *id001
    definition: label_values(up{task=~`${task:regex}`,job="node-exporter"}, instance)
    query:
      query: label_values(up{task=~`${task:regex}`,job="node-exporter"}, instance)
      refId: StandardVariableQuery
    refresh: 1
    sort: 1
    multi: true
    includeAll: true
    allValue: .*
    current:
      text: All
      value: $__all
  - name: net_device
    label: 主机网卡
    type: query
    datasource: *id001
    definition: label_values(node_network_receive_bytes_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`},
      device)
    query:
      query: label_values(node_network_receive_bytes_total{task=~`${task:regex}`,job="node-exporter",instance=~`${host:regex}`},
        device)
      refId: StandardVariableQuery
    refresh: 1
    sort: 1
    multi: true
    includeAll: true
    allValue: .*
    current:
      text: All
      value: $__all
  - name: gpu_node
    label: GPU 节点
    type: query
    datasource: *id001
    definition: label_values(DCGM_FI_DEV_GPU_UTIL{task=~`${task:regex}`}, gpu_node)
    query:
      query: label_values(DCGM_FI_DEV_GPU_UTIL{task=~`${task:regex}`}, gpu_node)
      refId: StandardVariableQuery
    refresh: 1
    sort: 1
    multi: true
    includeAll: true
    allValue: .*
    current:
      text: All
      value: $__all
  - name: gpu_model
    label: GPU 型号
    type: query
    datasource: *id001
    definition: label_values(DCGM_FI_DEV_GPU_UTIL{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`}, gpu_model)
    query:
      query: label_values(DCGM_FI_DEV_GPU_UTIL{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`}, gpu_model)
      refId: StandardVariableQuery
    refresh: 1
    sort: 1
    multi: true
    includeAll: true
    allValue: .*
    current:
      text: All
      value: $__all
  - name: gpu_index
    label: GPU 卡序号
    type: query
    datasource: *id001
    definition: label_values(DCGM_FI_DEV_GPU_UTIL{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`},
      gpu_index)
    query:
      query: label_values(DCGM_FI_DEV_GPU_UTIL{task=~`${task:regex}`,gpu_node=~`${gpu_node:regex}`,gpu_model=~`${gpu_model:regex}`},
        gpu_index)
      refId: StandardVariableQuery
    refresh: 1
    sort: 1
    multi: true
    includeAll: true
    allValue: .*
    current:
      text: All
      value: $__all
  - name: instance_role
    label: 日志实例角色
    type: query
    datasource: *id002
    definition: label_values({task=${task:doublequote}}, instance_role)
    query:
      type: 1
      label: instance_role
      stream: '{task=${task:doublequote}}'
      refId: LokiVariableQueryEditor-VariableQuery
    refresh: 1
    sort: 1
    multi: true
    includeAll: true
    allValue: .*
    current:
      text: All
      value: $__all
  - name: replica
    label: 日志副本
    type: query
    datasource: *id002
    definition: label_values({task=${task:doublequote},instance_role=~"$instance_role"}, replica)
    query:
      type: 1
      label: replica
      stream: '{task=${task:doublequote},instance_role=~"$instance_role"}'
      refId: LokiVariableQueryEditor-VariableQuery
    refresh: 1
    sort: 1
    multi: true
    includeAll: true
    allValue: .*
    current:
      text: All
      value: $__all
  - name: source_file
    label: 日志文件
    type: query
    datasource: *id002
    definition: label_values({task=${task:doublequote},instance_role=~"$instance_role",replica=~"$replica"}, source_file)
    query:
      type: 1
      label: source_file
      stream: '{task=${task:doublequote},instance_role=~"$instance_role",replica=~"$replica"}'
      refId: LokiVariableQueryEditor-VariableQuery
    refresh: 1
    sort: 1
    multi: true
    includeAll: true
    allValue: .*
    current:
      text: All
      value: $__all
  - name: log_search
    label: 日志包含
    type: textbox
    query: ''
    current:
      text: ''
      value: ''
annotations:
  list: []
links: []
