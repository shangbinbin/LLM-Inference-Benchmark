# 仅管理 glm52-sglang-3node-group-0 的 rank 0/1/2 活跃日志。
# 并行部署其他推理组时，应使用独立目录/前缀和独立 logrotate state。
/private/benchmark-data/sglang-log/glm52-3node-8gpu-run-01-rank-[0-2].log {
    daily
    maxsize 1G

    # 每个 Rank 独立轮转；按历史文件年龄而不是数量清理。
    rotate -1
    maxage 7

    missingok
    notifempty
    copytruncate
    su root root

    compress
    dateext
    dateformat -%Y%m%d-%H%M%S
}
