auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1

  # Loki 容器内的数据根目录
  path_prefix: /private/benchmark-data/loki/data

  storage:
    filesystem:
      chunks_directory: /private/benchmark-data/loki/data/chunks
      rules_directory: /private/benchmark-data/loki/data/rules

  replication_factor: 1

  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /private/benchmark-data/loki/data/tsdb-index
    cache_location: /private/benchmark-data/loki/data/tsdb-cache

analytics:
  reporting_enabled: false
