# 当前只管理 sglang-ib-2node-group-0 的两个平铺 Rank 文件。并行部署其他推理组时，
# 应为每组使用独立目录/前缀，并确保只有一个 logrotate 实例处理同一文件集合。
/private/benchmark-data/sglang-log/sglang-server-rank-*.log {
    daily
    maxsize 1G

    # 每个 Rank 独立轮转；按历史文件年龄而不是数量清理。
    rotate -1
    maxage 7

    missingok
    notifempty
    copytruncate
    su root root

    compress
    dateext
    dateformat -%Y%m%d-%H%M%S
}
